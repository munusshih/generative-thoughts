<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generative Thoughts</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main id="app">
    <section class="workspace">

      <section class="writing">

        <div class="thought-switcher-wrap">
          <select id="thoughtSwitcher" aria-label="Thoughts"></select>
        </div>

        <textarea id="titleInput" class="title-input" rows="1" spellcheck="true"
          placeholder="Title"></textarea>

        <textarea id="thoughtInput" class="thought-input" spellcheck="true"
          placeholder="Write."></textarea>

      </section>

      <section class="preview">
        <div id="previewCanvas" class="canvas-shell" tabindex="0"
          aria-label="Preview. Click to advance."></div>
      </section>

      <div class="actions">
        <button id="randomVisualButton" type="button">
          RANDOM VISUAL
        </button>

        <button id="publishButton" type="button">
          PUBLISH
        </button>
        <button id="analysisButton" type="button">
          ANALYSIS
        </button>
      </div>

    </section>

    <div id="modelProgress" class="model-progress" aria-hidden="true">
      <div id="modelProgressFill"></div>
    </div>

    <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmDialogTitle"
      aria-describedby="confirmDialogMessage">
      <form method="dialog">
        <h2 id="confirmDialogTitle"></h2>
        <p id="confirmDialogMessage"></p>
        <div class="confirm-dialog-actions">
          <button type="submit" value="cancel">CANCEL</button>
          <button id="confirmDialogProceed" type="submit" value="confirm">PROCEED</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status"></div>
  </main>

  <script type="module" src="./app.js"></script>
</body>

</html>
