<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generative Thoughts</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app">
    <section class="workspace">
      <section class="writing">
        <textarea id="titleInput" class="title-input" rows="1" spellcheck="true" placeholder="Title"></textarea>
        <textarea id="thoughtInput" class="thought-input" spellcheck="true" placeholder="Write."></textarea>
      </section>

      <section class="preview">
        <div id="previewCanvas" class="canvas-shell" tabindex="0" aria-label="Preview. Click to advance."></div>
      </section>

      <button id="publishButton" class="publish-button" type="button">PUBLISH</button>
    </section>

    <div id="modelProgress" class="model-progress" aria-hidden="true">
      <div id="modelProgressFill"></div>
    </div>

    <div id="toast" class="toast" role="status"></div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
